name: CI Log Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-logs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        log_file: [type1.log, type2.log, type3.log]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI-Log-Analyzer Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_FILE_NAME: tests/logs/${{ matrix.log_file }}
          SLACK_URL: ${{ secrets.TEST_SLACK_URL }}
        run: |
          python aiops_log_converter.py

  build-and-push:
    needs: test-logs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          [cite_start]make build [cite: 23]
      
      # Add your Docker Hub/GHCR login and push steps here
